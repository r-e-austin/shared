---
- name: Terraform Cloud Run Task Listener
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Validate HMAC secret and debug
      condition: event.payload is defined
      # action:
      #   debug:
      #     var: event
      action:
        run_job_template:
          name: "TFC Run Task execution"
          organization: "Default"
          job_args:
            extra_vars:
              tfc_full_payload: "{{ event.payload }}"
